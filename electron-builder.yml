appId: com.nasif.retailpos
productName: Retail POS
directories:
  output: release
files:
  - dist
  - dist-electron
  - prisma
  - node_modules/@prisma
  - node_modules/prisma
  - node_modules/.prisma
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: prisma/
    to: prisma/
    filter:
      - "*.db"
      - "*.prisma"
